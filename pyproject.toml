[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
name = "pair_trading"
version = "0.1.0"

authors = [
    { name = "Richard Petocz", email = "petocz.ricsi@gmail.com" }
]

requires-python = ">=3.12"

dependencies = [
    "algo_toolbox",
    "pandas",
    "numpy",
    "numba",
    "plotly",
    "scikit-learn",
    "statsmodels",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pair_trading", "pair_trading.*"]
namespaces = false

[tool.setuptools.package-data]
pair_trading = [
    "strategies/configs/*.yaml",
]
